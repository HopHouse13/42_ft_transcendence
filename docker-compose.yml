services:
  proxy:
    build: ./proxy
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS (à configurer plus tard)
    networks:
      - ft_transcendence_network

  backend:
    build: ./back-end
    volumes:
      - ./back-end:/app       # ton code hôte monté en live dans le conteneur
      - /app/node_modules     # évite d'écraser node_modules du conteneur par un volume vide de l'hôte
    ports:
      - "3000:3000"
    env_file:
      - ./back-end/.env
    environment:
      - DATABASE_URL=postgres://othello_user:othello_pass@database:5432/othello_db
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ft_transcendence_network

  frontend:
    build: ./front-end
    volumes:
      - ./front-end:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - ft_transcendence_network

  database:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U othello_user -d othello_db"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      - ft_transcendence_network

# Réseau dédié pour que les conteneurs communiquent
networks:
  ft_transcendence_network:
    driver: bridge

volumes:
  postgres_data:
