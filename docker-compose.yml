services:
  proxy:
    build: ./proxy
    container_name: nginx
    ports:
      - "8080:80"       # HTTP (proxy redirects to 443)
      - "8443:443"     # HTTPS
    depends_on:
      - backend
      - frontend
      - grafana
      - prometheus     # added for prometheus interface through proxy
    networks:
      - ft_transcendence_network

  backend:
    build: ./back-end
    container_name: backend
    volumes:
      - ./back-end:/app       # ton code hôte monté en live dans le conteneur
      - /app/node_modules     # évite d'écraser node_modules du conteneur par un volume vide de l'hôte
    env_file:
      - ./back-end/.env
    environment:
      - DATABASE_URL=postgres://othello_user:othello_pass@database:5432/othello_db
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ft_transcendence_network
    expose:
      - "3000"

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./front-end:/app
      - /app/node_modules
    # ports:
    #   - "5173:5173"
    networks:
      - ft_transcendence_network
    expose:
      - "5173"

  database:
    image: docker.io/library/postgres:16-alpine
    container_name: db
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
       - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U othello_user -d othello_db"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      - ft_transcendence_network

  grafana:
    image: docker.io/grafana/grafana:13.2.3
    container_name: grafana
    depends_on:
      - database
      - prometheus
    environment:
      - GF_SERVER_ROOT_URL=https://localhost:8443/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true # keep /grafana/ sublocation full URI
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    restart: unless-stopped
    # ports:
    #   - "3101:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:Z
    networks:
      - ft_transcendence_network
    expose:
      - "3000"

  prometheus:
    image: docker.io/prom/prometheus:v3.13.3
    container_name: prometheus
    depends_on:
      - backend
      - database
    restart: unless-stopped
    # ports:
    #   - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:Z # /path/to/prometheus.yml:/etc/prometheus/prometheus.yml \ prom/prometheus
      - prometheus-data:/prometheus
    networks:
      - ft_transcendence_network
    expose:
      - "9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml" # added for prometheus interface through proxy
      - "--web.external-url=https://localhost:8443/prometheus/" # added for prometheus interface through proxy
      - "--web.route-prefix=/" # added for prometheus interface through proxy

  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    env_file:
      - .env
    environment:
      - DATA_SOURCE_URI=database:5432/${POSTGRES_DB}?sslmode=disable
      - DATA_SOURCE_USER=${POSTGRES_USER}
      - DATA_SOURCE_PASS=${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ft_transcendence_network
    expose:
      - "9187"
    restart: unless-stopped

  node-exporter:
    image: docker.io/prom/node-exporter:v1.12.1
    container_name: node-exporter
    command:
      # - '--path.rootfs=/host'
      - '--path.procfs=/host/proc' # "Read CPU and RAM data
      - '--path.rootfs=/rootfs'    # "Read disk space data
      - '--path.sysfs=/host/sys'   # "Read hardware and network data
    pid: host
    networks:
      - ft_transcendence_network
    expose:
      - "9100"
    restart: unless-stopped
    volumes:
      # - '/:/host:ro,rslave' # rslave doesnt work on docker-desktop (macos/windows)
      - /proc:/host/proc:ro
      - /:/rootfs:ro
      - /sys:/host/sys:ro

  nginx-exporter:
    image: docker.io/nginx/nginx-prometheus-exporter:1.3
    container_name: nginx-exporter
    depends_on:
      - proxy
    command:
      - -nginx.scrape-uri=http://proxy:81/stub_status
    networks:
      - ft_transcendence_network
    restart: unless-stopped


# Réseau dédié pour que les conteneurs communiquent
networks:
  ft_transcendence_network:
    driver: bridge

volumes:
  postgres_data:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local