services:
  proxy:
    image: proxy-img
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      grafana:
        condition: service_started
      prometheus:        # added for prometheus interface through proxy
        condition: service_started
    ports:
      - "8080:80"        # HTTP (proxy redirects to 443)
      - "8443:443"       # HTTPS
    networks:
      - transcendence-net
    restart: on-failure:5

  database:
    image: docker.io/library/postgres:16-alpine
    container_name: db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 10
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence-net
    expose:
      - "5432"
    restart: unless-stopped

  backend:
    image: backend-img
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/app        # bind-mount
      - /app/node_modules     # évite d'écraser node_modules du conteneur par un volume vide de l'hôte
    networks:
      - transcendence-net
    expose:
      - "3000"
    restart: on-failure:5

  frontend:
    image: frontend-img
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - transcendence-net
    expose:
      - "5173"
    restart: on-failure:5

  prometheus:
    image: docker.io/prom/prometheus:v3.13.3
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:Z # /path/to/prometheus.yml:/etc/prometheus/prometheus.yml \ prom/prometheus
      - prometheus-data:/prometheus
    networks:
      - transcendence-net
    expose:
      - "9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml" # added for prometheus interface through proxy
      - "--web.external-url=${APP_URL}/prometheus/" # added for prometheus interface through proxy
      - "--web.route-prefix=/" # added for prometheus interface through proxy
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:13.2.3
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      - GF_SERVER_ROOT_URL=${APP_URL}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true # keep /grafana/ sublocation full URI
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_COOKIE_SECURE=true  # enabling this flag ensures the grafana_session cookie is sent with the Secure attribute.
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY} # Session key: Providing your own secret key in .env prevents using a publicly known cryptographic key.
      - GF_SECRETS_MANAGER_ENCRYPTION_SECRET_KEY_V1_SECRET_KEY=${GRAFANA_ENCRYPTION_KEY} # secrets manager - envelope encryption: if datasource (prometheus, PostgreSQL) configuration requires a password, encrypts that password
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:Z
    networks:
      - transcendence-net
    expose:
      - "3000"
    restart: unless-stopped

  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATA_SOURCE_URI=database:5432/${POSTGRES_DB}?sslmode=disable
      - DATA_SOURCE_USER=${POSTGRES_USER}
      - DATA_SOURCE_PASS=${POSTGRES_PASSWORD}
    networks:
      - transcendence-net
    expose:
      - "9187"
    restart: unless-stopped

  node-exporter:
    image: docker.io/prom/node-exporter:v1.12.1
    container_name: node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /:/rootfs:ro
      - /sys:/host/sys:ro
    networks:
      - transcendence-net
    expose:
      - "9100"
    command:
      - '--path.procfs=/host/proc' # "Read CPU and RAM data
      - '--path.rootfs=/rootfs'    # "Read disk space data
      - '--path.sysfs=/host/sys'   # "Read hardware and network data
    restart: unless-stopped

  nginx-exporter:
    image: docker.io/nginx/nginx-prometheus-exporter:1.3
    container_name: nginx-exporter
    depends_on:
      proxy:
        condition: service_started
    networks:
      - transcendence-net
    command:
      - "--nginx.scrape-uri=http://proxy:81/stub_status"
    restart: unless-stopped

networks:
  transcendence-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local