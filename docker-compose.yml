services:
  proxy:
    build: ./proxy
    container_name: nginx
    ports:
      - "8080:80"       # HTTP (redirects to 443)
      - "8443:443"     # HTTPS
    depends_on:
      - backend
      - frontend
    networks:
      - ft_transcendence_network

  backend:
    build: ./back-end
    container_name: backend
    volumes:
      - ./back-end:/app       # ton code hôte monté en live dans le conteneur
      - /app/node_modules     # évite d'écraser node_modules du conteneur par un volume vide de l'hôte
    # ports:
    #   - "3000:3000"
    env_file:
      - ./back-end/.env
    environment:
      - DATABASE_URL=postgres://othello_user:othello_pass@database:5432/othello_db
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ft_transcendence_network

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./front-end:/app
      - /app/node_modules
    # ports:
    #   - "5173:5173"
    networks:
      - ft_transcendence_network

  database:
    image: docker.io/library/postgres:16-alpine
    container_name: db
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
       - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U othello_user -d othello_db"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      - ft_transcendence_network

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: grafana
    depends_on:
      - database
      - prometheus
    environment:
      - GF_SERVER_ROOT_URL=https://localhost:8443/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    restart: unless-stopped
    # ports:
    #   - "3101:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - ft_transcendence_network

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: prometheus
    depends_on:
      - database
    restart: unless-stopped
    # ports:
    #   - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:Z # /path/to/prometheus.yml:/etc/prometheus/prometheus.yml \ prom/prometheus
      - prometheus-data:/prometheus
    networks:
      - ft_transcendence_network
    # command:
    #   - "--config.file=/etc/config/prometheus.yml"


# Réseau dédié pour que les conteneurs communiquent
networks:
  ft_transcendence_network:
    driver: bridge

volumes:
  postgres_data:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local