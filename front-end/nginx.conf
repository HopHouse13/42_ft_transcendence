server {
    listen 80;
    server_name _;

    # --- HTTPS obligatoire pour ft_transcendence : on redirige tout le HTTP vers HTTPS ---
    # (décommente une fois que tu as des certificats en place, voir bloc 443 ci-dessous)
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # --- Fichiers statiques du build React ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Reverse proxy vers le backend (API REST) ---
    # Adapte "backend" au nom du service dans docker-compose.yml et le port au port réel du backend
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Reverse proxy vers le backend (WebSocket, jeu en temps réel) ---
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

