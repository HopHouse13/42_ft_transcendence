server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

	# Route /api/ requests to the backend (NestJS)
    location /api/ {
        # The trailing slash here is important. It strips '/api' before sending it to NestJS.
        # Example: https://IP/api/users -> http://backend:3000/users
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

	# Route WebSocket traffic for socket.io (NestJS)
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

	# Route all other requests (the root) to the frontend (Vite)
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade headers (Needed for Vite HMR in dev mode)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Redirect HTTP (port 8080 on host -> 80 in container) to HTTPS (port 8443 on host)
server {
    listen 80;
    server_name localhost;

    # Explicitly append :8443 so the browser doesn't default to 443
    return 301 https://$host:8443$request_uri;
}
