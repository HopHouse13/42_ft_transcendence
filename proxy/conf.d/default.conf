server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    # Redirige HTTP vers HTTPS
    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    }

    # Route les requêtes /api/ vers ton back-end
    location /api/ {
        proxy_pass http://backend:3000/;  # "backend" = nom du service dans docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # (Plus tard) Route la racine / vers le front-end
    # location / {
    #     proxy_pass http://frontend:3001;
    # }
}

# Redirige le port 80 vers HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}
