server {
    listen 443 ssl;
    server_name localhost;

    error_page 497 =308 https://$host:8443$request_uri; # redirect HTTP-to-HTTPS-port 497 error to 308 redirect (keeping HTTP method) eg http://localhost:8443

    client_max_body_size 2m;

    absolute_redirect off;  # Prevents Nginx from dropping :8443 during trailing-slash redirects

    ssl_certificate     /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    # Modern SSL security from nginx docs `Module ngx_http_ssl_module`
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384; # Mozilla SSL Configuration Generator
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

  # Route /api/ requests to the backend (NestJS)
    location /api/ {
        # The trailing slash here is important. It strips '/api' before sending it to NestJS.
        # Example: https://IP/api/user -> http://backend:3000/user
        proxy_pass http://backend:3000/;
        proxy_set_header Host   $http_host; # eg $http_host=localhost:8443, avoiding potential port dropping $host=localhost
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/metrics { # used inside docker-network by prometheus backend scraper
      default_type application/json;
      return 404 '{"message":"Cannot $request_method /api/metrics","error":"Not Found","statusCode":404}';
      # redirects to a default 404 json page not found instead of a 403 nginx dead giveaway (return 403;)
    }

  # Route WebSocket traffic for socket.io (NestJS)
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host   $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Prevent idle websockets disconnects
        proxy_read_timeout 3600s; # 1hour (default is 60s)
        proxy_send_timeout 3600s;
    }

  # Route /grafana/ to the Grafana container
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade headers for Grafana Live (/api/live/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

  # Route all other requests (the root) to the frontend (Vite)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host   $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade headers (Needed for Vite HMR in dev mode)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

}

# Redirect HTTP (port 8080 on host -> 80 in container) to HTTPS (port 8443 on host)
server {
    listen 80;
    server_name localhost;

    # Explicitly append :8443 so the browser doesn't default to 443
    return 301 https://$host:8443$request_uri;
}

 # for prometheus nginx-exporter scraping
server {
    listen 81; # Create an Internal Metrics Port
    server_name localhost;

    location /stub_status {
        stub_status; # Restricted to the internal Docker network by default
        allow all;
    }
}